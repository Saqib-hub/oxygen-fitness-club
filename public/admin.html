<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel | Oxygen Fitness Club</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- Chart ke liye -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e50914">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
<style>
  .admin-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
  .admin-tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 2px solid #222; }
  .admin-tab { padding: 12px 25px; background: transparent; border: none; color: #aaa; cursor: pointer; font-size: 16px; font-weight: 600; transition: 0.3s; }
  .admin-tab.active { color: var(--red); border-bottom: 3px solid var(--red); }
  .admin-tab:hover { color: var(--red); }
  .admin-card { background: var(--gray); padding: 25px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid var(--red); }
  .admin-card h3 { color: var(--red); margin-bottom: 10px; font-size: 18px; }
  .admin-card p { margin: 8px 0; color: #ccc; font-size: 14px; }
  .admin-card .msg { background: #111; padding: 12px; border-radius: 5px; margin-top: 10px; color: #fff; }
  .admin-actions { margin-top: 15px; display: flex; gap: 10px; }
  .btn-delete { background: #e50914; color: #fff; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; }
  .btn-delete:hover { background: #b00710; }
  .empty-state { text-align: center; padding: 60px; color: #666; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
  .stat-card { background: var(--gray); padding: 25px; border-radius: 10px; text-align: center; border-top: 4px solid var(--red); }
  .stat-card h2 { font-size: 36px; color: var(--red); margin-bottom: 5px; }
  .stat-card p { color: #aaa; font-size: 14px; }
  
  /* Login Screen Style */
  #loginScreen { height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d0d0d; }
  .login-box { background: var(--gray); padding: 40px; border-radius: 10px; border-top: 4px solid var(--red); text-align: center; width: 350px; }
  .login-box h2 { color: #fff; margin-bottom: 20px; }
  .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0d0d0d; border: 1px solid #333; color: #fff; border-radius: 5px; }
  .login-box button { width: 100%; padding: 12px; background: var(--red); color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
  #loginError { color: var(--red); margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
  <div class="login-box">
    <h2><i class="fas fa-lock" style="color: var(--red);"></i> Admin Login</h2>
    <input type="password" id="adminPass" placeholder="Enter Admin Password">
    <button onclick="checkPassword()">Login</button>
    <p id="loginError"></p>
  </div>
</div>

<!-- Main Admin Panel -->
<div id="adminContent" style="display: none;">
  <header class="navbar">
    <div class="logo">
      <img src="images/logo.png" alt="Logo">
      <span>Oxygen Fitness Club - Admin</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="admin.html" class="active">Admin</a></li>
      </ul>
    </nav>
  </header>

  <div class="admin-container">
    <h1 style="margin-bottom: 30px;">Admin <span style="color:var(--red)">Dashboard</span></h1>

    <div class="stats-grid">
      <div class="stat-card">
        <h2 id="totalContacts">0</h2>
        <p>Total Messages</p>
      </div>
      <div class="stat-card">
        <h2 id="totalMembers">0</h2>
        <p>Total Members</p>
      </div>
    </div>

    <!-- Chart Section -->
    <div style="background: var(--gray); padding: 20px; border-radius: 10px; margin-bottom: 30px;">
      <h3 style="color: #fff; margin-bottom: 15px;">Membership Plans Distribution</h3>
      <div style="max-width: 350px; margin: auto;">
        <canvas id="membersChart"></canvas>
      </div>
    </div>

    <div class="admin-tabs">
      <button class="admin-tab active" onclick="showTab('contacts', event)">
        <i class="fas fa-envelope"></i> Contact Messages
      </button>
      <button class="admin-tab" onclick="showTab('members', event)">
        <i class="fas fa-users"></i> Registered Members
      </button>
    </div>

    <div id="contacts-tab"><div id="contactsList"></div></div>
    <div id="members-tab" style="display:none;"><div id="membersList"></div></div>
  </div>

  <footer><p>© 2025 Oxygen Fitness Club - Admin Panel</p></footer>
</div>

<script>
// Login Logic
function checkPassword() {
  const pass = document.getElementById('adminPass').value;
  if (pass === 'OxygenAdmin2025') { // Yahan apna password check karein
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    loadContacts();
    loadMembers();
  } else {
    document.getElementById('loginError').innerText = 'Wrong Password! Try again.';
  }
}

function showTab(tab, event) {
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  if (tab === 'contacts') {
    document.getElementById('contacts-tab').style.display = 'block';
    document.getElementById('members-tab').style.display = 'none';
  } else {
    document.getElementById('contacts-tab').style.display = 'none';
    document.getElementById('members-tab').style.display = 'block';
  }
}

async function loadContacts() {
  const res = await fetch('/api/admin/contacts');
  const data = await res.json();
  const list = document.getElementById('contactsList');
  document.getElementById('totalContacts').innerText = data.contacts.length;
  if (data.contacts.length === 0) {
    list.innerHTML = '<div class="empty-state"><i class="fas fa-inbox" style="font-size:50px;"></i><p style="margin-top:20px;">No messages yet</p></div>';
    return;
  }
  list.innerHTML = data.contacts.map(c => `
    <div class="admin-card">
      <h3>${c.name}</h3>
      <p><i class="fas fa-envelope"></i> ${c.email}</p>
      <p><i class="fas fa-clock"></i> ${new Date(c.date).toLocaleString()}</p>
      <div class="msg">${c.message}</div>
      <div class="admin-actions">
        <button class="btn-delete" onclick="deleteContact('${c._id}')"><i class="fas fa-trash"></i> Delete</button>
      </div>
    </div>
  `).join('');
}

async function loadMembers() {
  const res = await fetch('/api/admin/members');
  const data = await res.json();
  const list = document.getElementById('membersList');
  document.getElementById('totalMembers').innerText = data.members.length;
  
  // Chart Data
  const plans = { Monthly: 0, Quarterly: 0, Yearly: 0 };
  data.members.forEach(m => { if(plans[m.plan] !== undefined) plans[m.plan]++; });
  
  const ctx = document.getElementById('membersChart').getContext('2d');
  if (window.myChart) window.myChart.destroy();
  window.myChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['Monthly', 'Quarterly', 'Yearly'],
      datasets: [{
        data: [plans.Monthly, plans.Quarterly, plans.Yearly],
        backgroundColor: ['#e50914', '#ff4d4d', '#b00710'],
        borderColor: '#1a1a1a',
        borderWidth: 2
      }]
    },
    options: { plugins: { legend: { labels: { color: '#fff' } } } }
  });

  if (data.members.length === 0) {
    list.innerHTML = '<div class="empty-state"><i class="fas fa-users" style="font-size:50px;"></i><p style="margin-top:20px;">No members yet</p></div>';
    return;
  }
  list.innerHTML = data.members.map(m => `
    <div class="admin-card">
      <h3>${m.name}</h3>
      <p><i class="fas fa-envelope"></i> ${m.email}</p>
      <p><i class="fas fa-phone"></i> ${m.phone}</p>
      <p><i class="fas fa-user"></i> Age: ${m.age}</p>
      <p><i class="fas fa-tag"></i> Plan: <strong style="color:var(--red)">${m.plan}</strong></p>
      <p><i class="fas fa-map-marker-alt"></i> ${m.address}</p>
      <p><i class="fas fa-clock"></i> ${new Date(m.joinedAt).toLocaleString()}</p>
      <div class="admin-actions">
        <button class="btn-delete" onclick="deleteMember('${m._id}')"><i class="fas fa-trash"></i> Delete</button>
      </div>
    </div>
  `).join('');
}

async function deleteContact(id) {
  if (!confirm('Delete this message?')) return;
  await fetch(`/api/admin/contact/${id}`, { method: 'DELETE' });
  loadContacts();
}

async function deleteMember(id) {
  if (!confirm('Delete this member?')) return;
  await fetch(`/api/admin/member/${id}`, { method: 'DELETE' });
  loadMembers();
}
</script>
</body>
</html>
