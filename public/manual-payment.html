<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment | Oxygen Fitness Club</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  .pay-container { max-width: 500px; margin: 50px auto; background: #1a1a1a; padding: 30px; border-radius: 10px; border-top: 4px solid #e50914; text-align: center; }
  .pay-container h1 { color: #e50914; margin-bottom: 10px; }
  .pay-box { background: #0d0d0d; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: left; border: 1px solid #333; }
  .pay-box p { margin: 10px 0; font-size: 15px; color: #ccc; }
  .pay-box strong { color: #fff; font-size: 18px; }
  .btn-pay { background: #e50914; color: #fff; padding: 15px; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
  .btn-pay:hover { background: #b00710; }
  .bank-logos { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; font-size: 40px; color: #25D366; }
</style>
</head>
<body style="background: #0d0d0d; color: #fff;">

<header class="navbar">
  <div class="logo"><img src="images/logo.png" alt="Logo"><span>Oxygen Fitness Club</span></div>
</header>

<div class="pay-container">
  <h1>Secure Payment</h1>
  <p style="color: #aaa;">Complete your membership payment to join the gym.</p>
  
  <div class="bank-logos">
    <i class="fas fa-credit-card"></i>
    <i class="fas fa-mobile-alt"></i>
  </div>

  <div class="pay-box">
    <p><strong>Send Payment to:</strong></p>
    <hr style="border-color: #333; margin: 10px 0;">
    <p><i class="fas fa-wallet"></i> <strong>Easypaisa:</strong> 0304-3621645</p>
    <p><i class="fas fa-wallet"></i> <strong>JazzCash:</strong> 0304-3621645</p>
    <p><i class="fas fa-money-bill-wave"></i> <strong>Amount:</strong> <span id="displayAmount"></span></p>
  </div>

  <button class="btn-pay" onclick="confirmPayment()">I have sent the payment</button>
</div>

<script>
// Amount URL se lo
const amount = new URLSearchParams(window.location.search).get('amount') || 800;
document.getElementById('displayAmount').innerText = `Rs. ${amount}`;

async function confirmPayment() {
  const memberData = JSON.parse(localStorage.getItem('memberData'));
  
  if (!memberData) {
    alert('Data not found. Please fill the form again.');
    window.location.href = '/join.html';
    return;
  }

  // Database me save karo
  const res = await fetch('/api/register', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(memberData)
  });
  const data = await res.json();
  
  alert(data.message);
  localStorage.removeItem('memberData');
  window.location.href = '/index.html';
}
</script>
</body>
</html>
